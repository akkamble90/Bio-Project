apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-inference
  labels:
    app: aggregation-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aggregation-inference
  template:
    metadata:
      labels:
        app: aggregation-inference
    spec:
      containers:
        - name: inference-service
          image: bio-inference-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: MINIO_ENDPOINT
              value: "http://minio-service:9000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "2Gi"